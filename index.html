
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
  >
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <title>Black Camera</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, sans-serif;
    }

    #camera {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #000;
    }

    button {
      padding: 15px 24px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
    }

    #startButton {
      background: #fff;
      color: #000;
    }

    #libraryButton {
      background: #333;
      color: #fff;
    }

    #blackScreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #000;
      display: none;
      touch-action: manipulation;
      z-index: 10;
    }

    #libraryScreen {
      display: none;
      position: fixed;
      inset: 0;
      overflow-y: auto;
      padding: 65px 20px 30px;
      background: #111;
      z-index: 20;
    }

    .videoItem {
      margin: 15px 0;
      padding: 15px;
      border-radius: 12px;
      background: #252525;
    }

    .videoItem button {
      margin: 10px 8px 0 0;
      font-size: 14px;
    }

    .videoItem video {
      width: 100%;
      margin-top: 12px;
    }

    #status {
      min-height: 20px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>

<body>

  <video id="camera" autoplay playsinline muted></video>

  <div id="startScreen">
    <button id="startButton">カメラを起動</button>
    <button id="libraryButton">保存した動画を見る</button>
    <div id="status"></div>
  </div>

  <div id="blackScreen"></div>

  <div id="libraryScreen">
    <button id="backButton">戻る</button>
    <h2>保存した動画</h2>
    <div id="videoList"></div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const blackScreen = document.getElementById("blackScreen");
    const libraryScreen = document.getElementById("libraryScreen");
    const libraryButton = document.getElementById("libraryButton");
    const backButton = document.getElementById("backButton");
    const videoList = document.getElementById("videoList");
    const status = document.getElementById("status");

    let stream = null;
    let recorder = null;
    let chunks = [];
    let isRecording = false;
    let lastTapTime = 0;
    let db = null;
    let libraryUrls = [];

    // 動画保存用データベース
    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("BlackCameraDB", 1);

        request.onupgradeneeded = () => {
          const database = request.result;

          if (!database.objectStoreNames.contains("videos")) {
            database.createObjectStore("videos", {
              keyPath: "id",
              autoIncrement: true
            });
          }
        };

        request.onsuccess = () => {
          db = request.result;
          resolve(db);
        };

        request.onerror = () => reject(request.error);
      });
    }

    const databaseReady = openDatabase();

    // 動画をアプリ内に保存
    async function storeVideo(blob) {
      await databaseReady;

      return new Promise((resolve, reject) => {
        const transaction = db.transaction("videos", "readwrite");
        const store = transaction.objectStore("videos");

        store.add({
          createdAt: new Date().toISOString(),
          blob: blob
        });

        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    // カメラ起動
    startButton.addEventListener("click", async () => {
      try {
        await databaseReady;

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: true
        });

        video.srcObject = stream;
        await video.play();

        status.textContent = "";
        startScreen.style.display = "none";
        blackScreen.style.display = "block";

      } catch (error) {
        alert("起動できませんでした。\n" + error.message);
      }
    });

    // 録画開始
    function startRecording() {
      if (!stream || isRecording) return;

      chunks = [];

      try {
        recorder = new MediaRecorder(stream);
      } catch (error) {
        alert("録画を開始できませんでした。\n" + error.message);
        return;
      }

      recorder.ondataavailable = event => {
        if (event.data.size > 0) {
          chunks.push(event.data);
        }
      };

      recorder.onstop = async () => {
        blackScreen.style.display = "none";
        startScreen.style.display = "flex";
        status.textContent = "動画を保存しています…";

        if (chunks.length === 0) {
          status.textContent = "動画データがありません。";
          return;
        }

        const mimeType =
          recorder.mimeType ||
          chunks[0].type ||
          "video/mp4";

        const blob = new Blob(chunks, {
          type: mimeType
        });

        try {
          await storeVideo(blob);
          status.textContent = "動画を保存しました";
        } catch (error) {
          status.textContent = "保存に失敗しました";
          alert(
            "動画を保存できませんでした。空き容量などを確認してください。\n" +
            error.message
          );
        }
      };

      recorder.start();
      isRecording = true;
    }

    // 録画停止
    function stopRecording() {
      if (
        !recorder ||
        !isRecording ||
        recorder.state === "inactive"
      ) {
        return;
      }

      isRecording = false;
      recorder.stop();

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
    }

    // ダブルタップ
    blackScreen.addEventListener("touchend", event => {
      event.preventDefault();

      const now = Date.now();
      const interval = now - lastTapTime;

      if (interval > 0 && interval < 350) {
        lastTapTime = 0;

        if (isRecording) {
          stopRecording();
        } else {
          startRecording();
        }

        return;
      }

      lastTapTime = now;
    }, { passive: false });

    // 保存した動画を取得
    async function getSavedVideos() {
      await databaseReady;

      return new Promise((resolve, reject) => {
        const transaction = db.transaction("videos", "readonly");
        const request = transaction.objectStore("videos").getAll();

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    // 動画一覧
    async function showLibrary() {
      startScreen.style.display = "none";
      libraryScreen.style.display = "block";
      videoList.textContent = "読み込み中…";

      libraryUrls.forEach(url => URL.revokeObjectURL(url));
      libraryUrls = [];

      try {
        const videos = await getSavedVideos();
        videos.reverse();

        videoList.textContent = "";

        if (videos.length === 0) {
          videoList.textContent = "保存した動画はありません。";
          return;
        }

        for (const item of videos) {
          const container = document.createElement("div");
          container.className = "videoItem";

          const date = document.createElement("div");
          date.textContent = new Date(item.createdAt).toLocaleString("ja-JP");

          const url = URL.createObjectURL(item.blob);
          libraryUrls.push(url);

          const player = document.createElement("video");
          player.src = url;
          player.controls = true;
          player.playsInline = true;
          player.preload = "metadata";

          const download = document.createElement("button");
          download.textContent = "iPhoneに保存";

          download.onclick = () => {
            const link = document.createElement("a");
            link.href = url;

            const extension =
              item.blob.type.includes("mp4") ? "mp4" : "webm";

            link.download = "BlackCamera-" + item.id + "." + extension;
            link.click();
          };

          container.appendChild(date);
          container.appendChild(player);
          container.appendChild(download);
          videoList.appendChild(container);
        }

      } catch (error) {
        videoList.textContent = "動画一覧を読み込めませんでした。";
      }
    }

    libraryButton.addEventListener("click", showLibrary);

    backButton.addEventListener("click", () => {
      libraryUrls.forEach(url => URL.revokeObjectURL(url));
      libraryUrls = [];

      videoList.textContent = "";
      libraryScreen.style.display = "none";
      startScreen.style.display = "flex";
    });
  </script>

</body>
</html>
