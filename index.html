<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Black Camera</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: white;
      font-family: sans-serif;
      overflow: hidden;
    }

    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .controls {
      position: fixed;
      bottom: 40px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 15px;
      z-index: 10;
    }

    button {
      font-size: 18px;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
    }

    #recordButton {
      display: none;
    }

    #stopButton {
      display: none;
    }
  </style>
</head>

<body>

  <video
    id="camera"
    autoplay
    playsinline
    muted>
  </video>

  <div class="controls">

    <button id="startButton">
      カメラを起動
    </button>

    <button id="recordButton">
      録画開始
    </button>

    <button id="stopButton">
      録画停止
    </button>

  </div>

  <script>

    const video =
      document.getElementById("camera");

    const startButton =
      document.getElementById("startButton");

    const recordButton =
      document.getElementById("recordButton");

    const stopButton =
      document.getElementById("stopButton");

    let stream = null;
    let recorder = null;
    let chunks = [];


    // -------------------------
    // カメラを起動
    // -------------------------

    startButton.addEventListener(
      "click",
      async () => {

        try {

          stream =
            await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: {
                  ideal: "environment"
                }
              },

              // 動画と一緒に音声も録音
              audio: true
            });

          video.srcObject = stream;

          video.style.display = "block";

          startButton.style.display = "none";
          recordButton.style.display = "block";

        } catch (error) {

          alert(
            "カメラを起動できませんでした。\n" +
            error.message
          );
        }
      }
    );


    // -------------------------
    // 録画開始
    // -------------------------

    recordButton.addEventListener(
      "click",
      () => {

        if (!stream) {
          return;
        }

        chunks = [];

        try {

          recorder =
            new MediaRecorder(stream);

        } catch (error) {

          alert(
            "録画を開始できませんでした。\n" +
            error.message
          );

          return;
        }


        // 録画データを受け取る
        recorder.ondataavailable =
          event => {

            if (event.data.size > 0) {
              chunks.push(event.data);
            }
          };


        // 録画終了後
        recorder.onstop =
          () => {

            const blob =
              new Blob(
                chunks,
                {
                  type: recorder.mimeType
                }
              );

            const url =
              URL.createObjectURL(blob);

            const link =
              document.createElement("a");

            link.href = url;

            // 現段階ではテスト用
            link.download = "video";

            document.body.appendChild(link);

            link.click();

            link.remove();

            setTimeout(
              () => {
                URL.revokeObjectURL(url);
              },
              3000
            );
          };


        recorder.start();

        recordButton.style.display = "none";
        stopButton.style.display = "block";
      }
    );


    // -------------------------
    // 録画停止
    // -------------------------

    stopButton.addEventListener(
      "click",
      () => {

        // 録画を停止
        if (
          recorder &&
          recorder.state !== "inactive"
        ) {

          recorder.stop();
        }


        // カメラ・マイクを完全停止
        if (stream) {

          stream
            .getTracks()
            .forEach(track => {

              track.stop();

            });

          stream = null;
        }


        // カメラ表示も終了
        video.srcObject = null;
        video.style.display = "none";


        // 最初の画面に戻す
        stopButton.style.display = "none";
        recordButton.style.display = "none";
        startButton.style.display = "block";
      }
    );

  </script>

</body>
</html>
