
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Black Camera 保存診断</title>
  <style>
    body {
      margin: 0;
      padding: 55px 20px 30px;
      background: #111;
      color: white;
      font-family: -apple-system, sans-serif;
    }

    h2 { font-size: 21px; }

    button {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 15px 0;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
    }

    button:disabled { opacity: .4; }

    #log {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 15px;
      background: #292929;
      border-radius: 10px;
      line-height: 1.7;
      font-size: 14px;
    }

    #camera {
      width: 100%;
      max-height: 240px;
      background: black;
    }

    #savedVideos video {
      width: 100%;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <h2>録画・保存テスト</h2>

  <video id="camera" autoplay playsinline muted></video>

  <button id="prepare">① カメラを起動</button>
  <button id="record" disabled>② 録画開始</button>
  <button id="stop" disabled>③ 録画停止・自動保存</button>
  <button id="check">④ 保存した動画を確認</button>

  <h3>診断結果</h3>
  <div id="log">テスト開始前</div>

  <div id="savedVideos"></div>

<script>
  const camera = document.getElementById("camera");
  const prepare = document.getElementById("prepare");
  const record = document.getElementById("record");
  const stop = document.getElementById("stop");
  const check = document.getElementById("check");
  const logBox = document.getElementById("log");
  const savedVideos = document.getElementById("savedVideos");

  let stream = null;
  let recorder = null;
  let chunks = [];
  let database = null;
  let previewUrls = [];

  function log(message) {
    const time = new Date().toLocaleTimeString("ja-JP");
    logBox.textContent += "\n" + time + " " + message;
  }

  function errorText(error) {
    return (error?.name || "不明") +
      " : " + (error?.message || String(error));
  }

  // データベースを開く
  function openDatabase() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open("BlackCameraDB", 1);

      request.onupgradeneeded = () => {
        const db = request.result;

        if (!db.objectStoreNames.contains("videos")) {
          db.createObjectStore("videos", {
            keyPath: "id",
            autoIncrement: true
          });
        }
      };

      request.onsuccess = () => {
        database = request.result;
        resolve(database);
      };

      request.onerror = () => reject(request.error);
      request.onblocked = () =>
        reject(new Error("データベースが使用中です"));
    });
  }

  const databaseReady = openDatabase();

  databaseReady.then(
    () => log("データベース：接続成功"),
    error => log("データベース：接続失敗 " + errorText(error))
  );

  // カメラ起動
  prepare.onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: true
      });

      camera.srcObject = stream;
      await camera.play();

      log("カメラ・マイク：起動成功");
      prepare.disabled = true;
      record.disabled = false;
    } catch (error) {
      log("カメラ起動エラー：" + errorText(error));
    }
  };

  // 録画開始
  record.onclick = () => {
    try {
      chunks = [];
      recorder = new MediaRecorder(stream);

      log("録画形式：" + (recorder.mimeType || "自動選択"));

      recorder.ondataavailable = event => {
        log("受信データ：" + event.data.size + "バイト");

        if (event.data.size > 0) {
          chunks.push(event.data);
        }
      };

      recorder.onerror = event => {
        log("録画エラー：" + errorText(event.error));
      };

      recorder.onstop = async () => {
        log("録画停止イベント：受信");

        const type =
          recorder.mimeType ||
          chunks[0]?.type ||
          "video/mp4";

        const blob = new Blob(chunks, { type });

        log("動画サイズ：" + blob.size + "バイト");

        if (blob.size === 0) {
          log("診断：動画データが空です");
          return;
        }

        try {
          await databaseReady;

          await new Promise((resolve, reject) => {
            const tx = database.transaction("videos", "readwrite");

            tx.objectStore("videos").add({
              createdAt: new Date().toISOString(),
              blob
            });

            tx.oncomplete = () => resolve();
            tx.onerror = () =>
              reject(tx.error || new Error("書き込み失敗"));
            tx.onabort = () =>
              reject(tx.error || new Error("保存中断"));
          });

          log("保存結果：成功");

        } catch (error) {
          log("保存結果：失敗");
          log("エラー詳細：" + errorText(error));
        }

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }

        camera.srcObject = null;
        prepare.disabled = false;
      };

      recorder.start();
      log("録画開始：成功");

      record.disabled = true;
      stop.disabled = false;

    } catch (error) {
      log("録画開始エラー：" + errorText(error));
    }
  };

  // 録画停止
  stop.onclick = () => {
    if (!recorder || recorder.state !== "recording") return;

    log("録画停止：実行");
    recorder.stop();

    stop.disabled = true;
  };

  // 保存済み動画を確認
  check.onclick = async () => {
    try {
      await databaseReady;

      const videos = await new Promise((resolve, reject) => {
        const tx = database.transaction("videos", "readonly");
        const request = tx.objectStore("videos").getAll();

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });

      log("保存済み動画：" + videos.length + "件");

      previewUrls.forEach(url => URL.revokeObjectURL(url));
      previewUrls = [];
      savedVideos.textContent = "";

      videos.slice(-3).reverse().forEach(item => {
        const url = URL.createObjectURL(item.blob);
        previewUrls.push(url);

        const label = document.createElement("p");
        label.textContent =
          new Date(item.createdAt).toLocaleString("ja-JP");

        const player = document.createElement("video");
        player.src = url;
        player.controls = true;
        player.playsInline = true;

        savedVideos.append(label, player);
      });

    } catch (error) {
      log("一覧取得エラー：" + errorText(error));
    }
  };
</script>
</body>
</html>
