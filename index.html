<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover,
             user-scalable=no"
  >

  <title>Black Camera</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    /*
      カメラ映像は録画に使うが、
      画面には表示しない
    */
    #camera {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #startButton {
      font-size: 18px;
      padding: 15px 24px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
    }

    /*
      カメラ起動後の黒画面。
      画面全体が操作領域になる。
    */
    #blackScreen {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      z-index: 10;
    }
  </style>
</head>

<body>

  <video
    id="camera"
    autoplay
    playsinline
    muted>
  </video>

  <div id="startScreen">
    <button id="startButton">
      カメラを起動
    </button>
  </div>

  <div id="blackScreen"></div>

  <script>

    const video =
      document.getElementById("camera");

    const startScreen =
      document.getElementById("startScreen");

    const startButton =
      document.getElementById("startButton");

    const blackScreen =
      document.getElementById("blackScreen");


    let stream = null;
    let recorder = null;
    let chunks = [];

    let isRecording = false;

    let lastTapTime = 0;


    // -------------------------
    // カメラ・マイク準備
    // -------------------------

    startButton.addEventListener(
      "click",
      async () => {

        try {

          stream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: {
                  ideal: "environment"
                }
              },

              audio: true
            });


          video.srcObject = stream;

          await video.play();


          // カメラ映像は表示せず黒画面へ
          startScreen.style.display = "none";

          blackScreen.style.display = "block";


        } catch (error) {

          alert(
            "カメラまたはマイクを起動できませんでした。\n" +
            error.message
          );

        }

      }
    );


    // -------------------------
    // 録画開始
    // -------------------------

    function startRecording() {

      if (!stream || isRecording) {
        return;
      }


      chunks = [];


      try {

        recorder =
          new MediaRecorder(stream);

      } catch (error) {

        alert(
          "録画を開始できませんでした。\n" +
          error.message
        );

        return;
      }


      recorder.ondataavailable =
        event => {

          if (event.data.size > 0) {

            chunks.push(event.data);

          }

        };


      recorder.onstop =
        () => {

          saveVideo();

        };


      recorder.start();

      isRecording = true;

    }


    // -------------------------
    // 録画停止
    // -------------------------

    function stopRecording() {

      if (
        !recorder ||
        !isRecording ||
        recorder.state === "inactive"
      ) {

        return;

      }


      isRecording = false;

      recorder.stop();


      // カメラ・マイクも停止
      if (stream) {

        stream
          .getTracks()
          .forEach(track => {

            track.stop();

          });

        stream = null;

      }


      video.srcObject = null;

    }


    // -------------------------
    // 動画保存
    // -------------------------

    function saveVideo() {

      if (chunks.length === 0) {
        return;
      }


      const mimeType =
        recorder.mimeType ||
        chunks[0].type ||
        "video/mp4";


      const blob =
        new Blob(
          chunks,
          {
            type: mimeType
          }
        );


      const url =
        URL.createObjectURL(blob);


      const link =
        document.createElement("a");


      link.href = url;

      /*
        拡張子を決め打ちせず、
        iPhone/Safari側の形式に任せる
      */
      link.download = "BlackCamera-video";


      document.body.appendChild(link);

      link.click();

      link.remove();


      setTimeout(
        () => {

          URL.revokeObjectURL(url);

        },
        5000
      );


      /*
        録画停止後はカメラも終了しているので、
        最初の画面へ戻す
      */

      blackScreen.style.display = "none";

      startScreen.style.display = "flex";

    }


    // -------------------------
    // ダブルタップ判定
    // -------------------------

    blackScreen.addEventListener(
      "touchend",
      event => {

        event.preventDefault();


        const now =
          Date.now();


        const interval =
          now - lastTapTime;


        /*
          350ms以内に2回タップしたら
          ダブルタップと判定
        */

        if (
          interval > 0 &&
          interval < 350
        ) {

          lastTapTime = 0;


          if (isRecording) {

            stopRecording();

          } else {

            startRecording();

          }


          return;

        }


        lastTapTime = now;

      },
      {
        passive: false
      }
    );

  </script>

</body>
</html>
