<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             viewport-fit=cover, user-scalable=no"
  >
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">

  <title>Black Camera</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    #camera {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* 普段は完全な黒画面 */
    #blackScreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #000;
      z-index: 10;
      touch-action: manipulation;
      -webkit-touch-callout: none;
    }

    /* 保存動画一覧 */
    #libraryScreen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      overflow-y: auto;
      padding:
        calc(20px + env(safe-area-inset-top))
        20px
        calc(30px + env(safe-area-inset-bottom));
      background: #111;
    }

    #backButton {
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #000;
      font-size: 16px;
    }

    .videoItem {
      margin: 18px 0;
      padding: 15px;
      background: #252525;
      border-radius: 12px;
    }

    .videoDate {
      margin-bottom: 10px;
      color: #ccc;
      font-size: 14px;
    }

    .videoItem video {
      width: 100%;
      background: #000;
      border-radius: 8px;
    }

    .deleteButton {
      margin-top: 12px;
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      background: #444;
      color: #fff;
    }

    #message {
      margin-top: 20px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <video
    id="camera"
    autoplay
    playsinline
    muted>
  </video>

  <div id="blackScreen"></div>

  <div id="libraryScreen">

    <button id="backButton">
      戻る
    </button>

    <h2>保存した動画</h2>

    <div id="message"></div>

    <div id="videoList"></div>

  </div>


<script>

  const camera =
    document.getElementById("camera");

  const blackScreen =
    document.getElementById("blackScreen");

  const libraryScreen =
    document.getElementById("libraryScreen");

  const backButton =
    document.getElementById("backButton");

  const videoList =
    document.getElementById("videoList");

  const message =
    document.getElementById("message");


  let stream = null;
  let recorder = null;
  let chunks = [];

  let isRecording = false;
  let isStarting = false;
  let isSaving = false;

  let lastTapTime = 0;

  let longPressTimer = null;
  let longPressActivated = false;

  let database = null;
  let previewUrls = [];


  // =========================
  // データベース
  // =========================

  function openDatabase() {

    return new Promise((resolve, reject) => {

      const request =
        indexedDB.open("BlackCameraDB", 1);


      request.onupgradeneeded = () => {

        const db = request.result;

        if (
          !db.objectStoreNames.contains("videos")
        ) {

          db.createObjectStore(
            "videos",
            {
              keyPath: "id",
              autoIncrement: true
            }
          );

        }

      };


      request.onsuccess = () => {

        database = request.result;

        resolve(database);

      };


      request.onerror = () => {

        reject(request.error);

      };

    });

  }


  const databaseReady =
    openDatabase();


  // =========================
  // カメラ起動＋録画開始
  // =========================

  async function startCameraAndRecording() {

    if (
      isStarting ||
      isRecording ||
      isSaving
    ) {
      return;
    }


    isStarting = true;


    try {

      await databaseReady;


      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: true

        });


      camera.srcObject = stream;

      await camera.play();


      chunks = [];


      recorder =
        new MediaRecorder(stream);


      recorder.ondataavailable =
        event => {

          if (event.data.size > 0) {

            chunks.push(event.data);

          }

        };


      recorder.onstop =
        saveRecording;


      recorder.start();

      isRecording = true;


    } catch (error) {

      alert(
        "カメラまたはマイクを開始できませんでした。\n" +
        error.message
      );


      if (stream) {

        stream
          .getTracks()
          .forEach(track => track.stop());

        stream = null;

      }


      camera.srcObject = null;


    } finally {

      isStarting = false;

    }

  }


  // =========================
  // 録画停止
  // =========================

  function stopRecording() {

    if (
      !recorder ||
      !isRecording ||
      recorder.state !== "recording"
    ) {
      return;
    }


    isRecording = false;
    isSaving = true;


    /*
      ここではカメラを止めない。
      最終データを受け取ってから止める。
    */

    recorder.stop();

  }


  // =========================
  // 自動保存
  // =========================

  async function saveRecording() {

    const type =
      recorder.mimeType ||
      chunks[0]?.type ||
      "video/mp4";


    const blob =
      new Blob(
        chunks,
        {
          type: type
        }
      );


    /*
      最終データ取得後に
      カメラ・マイクを停止
    */

    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());

      stream = null;

    }


    camera.srcObject = null;


    if (blob.size === 0) {

      isSaving = false;

      alert(
        "動画データを作成できませんでした。"
      );

      return;

    }


    try {

      await databaseReady;


      await new Promise(
        (resolve, reject) => {

          const transaction =
            database.transaction(
              "videos",
              "readwrite"
            );


          transaction
            .objectStore("videos")
            .add({

              createdAt:
                new Date().toISOString(),

              blob: blob

            });


          transaction.oncomplete =
            () => resolve();


          transaction.onerror =
            () => reject(
              transaction.error ||
              new Error("保存に失敗しました")
            );


          transaction.onabort =
            () => reject(
              transaction.error ||
              new Error("保存が中断されました")
            );

        }
      );


    } catch (error) {

      console.error(error);

      alert(
        "動画を保存できませんでした。"
      );

    } finally {

      isSaving = false;

    }

  }


  // =========================
  // 3秒長押し判定
  // =========================

  blackScreen.addEventListener(
    "touchstart",
    () => {

      longPressActivated = false;


      if (
        isRecording ||
        isStarting ||
        isSaving
      ) {
        return;
      }


      clearTimeout(longPressTimer);


      longPressTimer =
        setTimeout(() => {

          longPressActivated = true;

          lastTapTime = 0;

          showLibrary();

        }, 3000);

    },
    {
      passive: true
    }
  );


  blackScreen.addEventListener(
    "touchcancel",
    () => {

      clearTimeout(longPressTimer);

    }
  );


  // =========================
  // ダブルタップ判定
  // =========================

  blackScreen.addEventListener(
    "touchend",
    event => {

      event.preventDefault();

      clearTimeout(longPressTimer);


      /*
        3秒長押し後の指離しを
        タップとして数えない
      */

      if (longPressActivated) {

        longPressActivated = false;
        lastTapTime = 0;

        return;

      }


      const now = Date.now();

      const interval =
        now - lastTapTime;


      if (
        interval > 0 &&
        interval < 350
      ) {

        lastTapTime = 0;


        if (isRecording) {

          stopRecording();

        } else {

          startCameraAndRecording();

        }


        return;

      }


      lastTapTime = now;

    },
    {
      passive: false
    }
  );


  // =========================
  // 保存済み動画取得
  // =========================

  async function getSavedVideos() {

    await databaseReady;


    return new Promise(
      (resolve, reject) => {

        const transaction =
          database.transaction(
            "videos",
            "readonly"
          );


        const request =
          transaction
            .objectStore("videos")
            .getAll();


        request.onsuccess =
          () => resolve(request.result);


        request.onerror =
          () => reject(request.error);

      }
    );

  }


  // =========================
  // 動画削除
  // =========================

  async function deleteVideo(id) {

    await databaseReady;


    return new Promise(
      (resolve, reject) => {

        const transaction =
          database.transaction(
            "videos",
            "readwrite"
          );


        transaction
          .objectStore("videos")
          .delete(id);


        transaction.oncomplete =
          () => resolve();


        transaction.onerror =
          () => reject(transaction.error);

      }
    );

  }


  // =========================
  // 保存動画一覧を開く
  // =========================

  async function showLibrary() {

    if (
      isRecording ||
      isStarting ||
      isSaving
    ) {
      return;
    }


    libraryScreen.style.display =
      "block";


    message.textContent =
      "読み込み中…";


    videoList.textContent = "";


    previewUrls.forEach(
      url => URL.revokeObjectURL(url)
    );


    previewUrls = [];


    try {

      const videos =
        await getSavedVideos();


      videos.reverse();


      message.textContent = "";


      if (videos.length === 0) {

        message.textContent =
          "保存した動画はありません。";

        return;

      }


      for (const item of videos) {

        const container =
          document.createElement("div");

        container.className =
          "videoItem";


        const date =
          document.createElement("div");

        date.className =
          "videoDate";

        date.textContent =
          new Date(
            item.createdAt
          ).toLocaleString("ja-JP");


        const url =
          URL.createObjectURL(item.blob);

        previewUrls.push(url);


        const player =
          document.createElement("video");

        player.src = url;
        player.controls = true;
        player.playsInline = true;
        player.preload = "metadata";


        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "deleteButton";

        deleteButton.textContent =
          "この動画を削除";


        deleteButton.onclick =
          async () => {

            const ok =
              confirm(
                "この動画を削除しますか？"
              );


            if (!ok) {
              return;
            }


            await deleteVideo(item.id);

            showLibrary();

          };


        container.appendChild(date);
        container.appendChild(player);
        container.appendChild(deleteButton);

        videoList.appendChild(container);

      }


    } catch (error) {

      console.error(error);

      message.textContent =
        "動画一覧を読み込めませんでした。";

    }

  }


  // =========================
  // 動画一覧から黒画面へ戻る
  // =========================

  backButton.addEventListener(
    "click",
    () => {

      previewUrls.forEach(
        url => URL.revokeObjectURL(url)
      );


      previewUrls = [];

      videoList.textContent = "";

      libraryScreen.style.display =
        "none";

      lastTapTime = 0;

    }
  );

</script>

</body>
</html>
