<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">

  <title>Google表示テスト</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <iframe
    src="https://www.google.com/"
    title="Google">
  </iframe>

</body>
</html>
